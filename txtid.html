            /* SVGオブジェクトの作成 */
            function createSVG(tag){
			    return document.createElementNS("http://www.w3.org/2000/svg", tag);
		    }

            /* 画面の初期化(描画) */
            var curline;
            var elem;
            function init(){
                /* ボタン描画 */
                var sel = document.getElementById("sel");

                const currentUrl = window.location.origin;
                /* 別路線のボタンを表示 */
                button_cfg.forEach(function (o, i, a){
                    var btn = document.createElement("button");
                    btn.className = "line" + o.line_id;
                    btn.innerHTML = o.line_name;
                    btn.setAttribute('onclick', "location.href='" + o.link + "'");
                    sel.appendChild(btn);
                });

                /* つくばエクスプレスを最後に表示 */
                var btn = document.createElement("button");
                btn.className = "tx_line";
                btn.innerHTML = "つくばエクスプレス";
                btn.setAttribute('onclick', "location.href=new URL('./', window.location.href).href");
                sel.appendChild(btn);
                







                /* 線描画 */
                curline = "tx";
                var main = document.getElementById("main");
                linedata[curline].sections.forEach(function (o, i, a){
                    var sec = document.createElement("div");
                    sec.style.height = "192px";
				    sec.style.cssFloat = "left";
				    sec.style.position = "relative";
                    var svg = createSVG("svg");
                    svg.setAttribute("height", "192px");

                    /* 描画します */
                    sec.style.width = "192px";
                    svg.setAttribute("width", "192px");
                    svg.setAttribute("viewBox", "-96 -96 192 192");

                    /* 東急版と同じく、ホームを先に描画して駅名をその上に重ねる */
                    if ("plats" in o){
                        o.plats.forEach(function (p, i, a){
                            var plat = createSVG("rect");
                            plat.setAttribute("x", -31.5);
                            plat.setAttribute("y", p * 32 - 9.5);
                            plat.setAttribute("width", 63);
                            plat.setAttribute("height", 19);
                            plat.setAttribute("stroke", "white");
                            plat.setAttribute("stroke-width", 1);
                            plat.setAttribute("fill", "deepskyblue");
                            svg.appendChild(plat);
                        });
                    }
                    if ("station_name" in o){
                        var text = createSVG("text");
                        text.setAttribute("x", 0);
                        text.setAttribute("y", 6);
                        text.setAttribute("font-size", 16);
                        text.setAttribute("font-weight", "bold");
                        text.setAttribute("text-anchor", "middle");
                        text.setAttribute("fill", "white");
                        text.innerHTML = o.station_name;
                        svg.appendChild(text);
                    }
                    if ("tracks" in o){
                        var track = createSVG("path");
                        track.setAttribute("d", o.tracks);
                        track.setAttribute("stroke", "white");
                        track.setAttribute("stroke-width", 0.125);
                        track.setAttribute("fill", "none");
                        track.setAttribute("transform", "scale(16)");
                        svg.appendChild(track);
                    }

                    if ("position" in o){
                        if (!("station_name" in o)) {
                            o.position.forEach(function (s, i, a){
                                var line = createSVG("line");
                                line.setAttribute("x1", -64);
                                line.setAttribute("y1", (i - a.length / 2) * -32 - 16);
                                line.setAttribute("x2", 64);
                                line.setAttribute("y2", (i - a.length / 2) * -32 - 16);
                                line.setAttribute("stroke", "white");
                                line.setAttribute("stroke-width", 2);
                                svg.appendChild(line);
                            });
                        }
                        o.position.forEach(function (s, i, a){

                            const count = i + 1; 
                            var canv = document.createElement("div");
                            if ("station_name" in o){
                                canv.id = o.station_id + "s" + s + "p";
                            }else{
                                canv.id = s + "p";
                            }
                            canv.className = "section";

                            if ("platform" in o){
                                canv.style.top = (i * 32 + (i < 0 ? 64 : 32) + o.platform) + "px";
                            }else{
                                canv.style.top = i * 32 + (i < 0 ? 64 : 32) + "px";
                            }



                            canv.style.left = "64px";
                            sec.appendChild(canv);
                        });
                    }
                    sec.insertBefore(svg, sec.firstChild);
                    main.appendChild(sec);
                });
                update();
			    setInterval(update, 10000);
            }


            var request = null;
		    function update(){
                if (request != null)
				    return;

                request = new XMLHttpRequest();
                request.open("GET", "https://w-tid.jp/tokyu/tx.json?".concat(+new Date), true);
                request.onreadystatechange = function (){
                    if (request.readyState != 4 || request.status != 200)
					    return;
				    var res = JSON.parse(request.responseText);

                    
                    linedata[curline].sections.forEach(function (o, i, a){
                        if ('position' in o){
                            for (var i = -3; i <= 3; ++i){
                                if (i == 0)
				    			    continue;
                                o.position.forEach(function (s){

                                    if ('station_id' in o){
                                        var elem = document.getElementById(o.station_id + "s" + s + "p");
                                    }else{
                                        var elem = document.getElementById(s + "p");
                                    }
                                    while (elem.lastChild)
				    			        elem.removeChild(elem.lastChild);
                                });
                            }
                        }
                    });
                    /* 更新時間を表示させます */
                    var updatetime = document.getElementById("update");
                    const date = new Date(res.updated_at * 1000);
                    document.getElementById("update").textContent = '更新時刻:' + date.toLocaleString();





                    
                    

                    res.trains.forEach(function (o, i, a){
                        /* 電車を描く */
                        var tra = document.createElement("a");
					    tra.className = "train line" + o.train_kind_id; /* 種別によって表示色を変更します。 */
                        tra.href = "https://www.tx-app.com/lines/mainline/trains/" + o.train_number;
                        tra.setAttribute('target', '_blank');
                        tra.setAttribute('rel', 'noopener');
                        var box = document.createElement("div");
					    box.className = "box";
                        box.innerHTML = "<div class=\"numberkind\">" + o.train_number + " " + train_kind_disp[o.train_kind_id] + "</div><div class=\"boxdest\">" + (('destination_station_id' in o) ? destination_station[o.destination_station_id] : "") + "</div>";
                        tra.appendChild(box);
					    var dir = document.createElement("div");
                        if (o.direction == "up"){
                            dir.className = "up";
                        }else{
                            dir.className = "down";
                        }

                        tra.appendChild(dir);
					    if (o.delay > 60){
                            var delay = document.createElement("div");
                            delay.className = "delay";
                            delay.innerHTML = "+" + Math.floor(o.delay / 60);
                            tra.appendChild(delay);
                        }
                        if ('train_orchestration_number' in o){
                            var info = document.createElement("div");
                            info.className = "info";
                            var formNo = (o.train_orchestration_number >= 1 && o.train_orchestration_number <= 14 ? 1 : o.train_orchestration_number >= 67 && o.train_orchestration_number <= 70 || o.train_orchestration_number >= 72 && o.train_orchestration_number <= 73 ? 2 : o.train_orchestration_number >= 81 && o.train_orchestration_number <= 85 ? 3 : 2);
                            info.innerHTML = formNo + "6" + String(o.train_orchestration_number).padStart(2, '0') + "F";
                            tra.appendChild(info);
                        }
                        if (o.next_station_id == null){
                            /* 駅に到着している場合 */
                            var printID = o.station_id + "s" + o.position + "p";
                        }else{
                            /* 駅間にいる場合 */

                            var printID = "".concat(o.station_id,o.next_station_id, "p"); 
                        }




                        if (document.getElementById(printID) != null)
						    document.getElementById(printID).appendChild(tra);
					    else
						    document.getElementById("log").innerText += "Unknown: " + elem + "\t" + JSON.stringify(o) + "\n";
                    });
                    request = null;
                }
                request.send(null);
            }
            document.addEventListener("DOMContentLoaded", init, false);
